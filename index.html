<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ff69b4">
    <title>恋爱纪念册 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== 登录/注册页 ===== */
        .login-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            margin-top: 60px;
            display: none;
        }

        .login-container h1 {
            color: #ff69b4;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container > p {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffe0f0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff69b4;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #ccc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ffe0f0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #fff;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
        }

        .error-message {
            color: #ff1493;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .error-message.show { display: block; }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .hint-text span { color: #ff69b4; font-weight: bold; }

        .resend-btn {
            padding: 8px 15px;
            background: #ffb6c1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .resend-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* ===== 情侣配对页 ===== */
        .couple-setup-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            margin-top: 60px;
            display: none;
            text-align: center;
        }

        .couple-setup-container h1 {
            color: #ff69b4;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .couple-setup-container .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .couple-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .couple-option-card {
            background: #fff9f0;
            border: 2px solid #ffe0f0;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .couple-option-card:hover {
            border-color: #ff69b4;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2);
        }

        .couple-option-card h3 {
            color: #ff69b4;
            margin-bottom: 6px;
            font-size: 16px;
        }

        .couple-option-card p {
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }

        .couple-panel {
            display: none;
            text-align: left;
        }

        .couple-panel.active { display: block; }

        .invite-code-display {
            background: linear-gradient(135deg, #fff0f8 0%, #ffe8f5 100%);
            border: 3px dashed #ffb6c1;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin: 20px 0;
        }

        .invite-code-display .code {
            font-size: 42px;
            font-weight: bold;
            color: #ff69b4;
            letter-spacing: 8px;
            margin: 10px 0;
            font-family: monospace;
        }

        .invite-code-display p {
            color: #999;
            font-size: 13px;
        }

        .copy-code-btn {
            padding: 10px 20px;
            background: #ffb6c1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-code-btn:hover { background: #ff69b4; }

        .waiting-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ff69b4;
            font-size: 14px;
            margin: 15px 0;
        }

        .dot-pulse {
            display: flex;
            gap: 4px;
        }

        .dot-pulse span {
            width: 6px;
            height: 6px;
            background: #ff69b4;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }

        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== 主页 ===== */
        .main-container { display: none; }

        .header {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { color: #ff69b4; font-size: 24px; }

        .user-info { color: #666; font-size: 14px; }

        .logout-btn {
            background: #ffb6c1;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
        }

        .couple-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .post-box {
            background: #fff9e6;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.15);
            border: 3px solid #ffe0f0;
            position: relative;
        }

        .post-box::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            width: 40px;
            height: 20px;
            background: #ffb6c1;
            border-radius: 5px 5px 0 0;
        }

        .post-box textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #ffe0f0;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            font-family: inherit;
            background: white;
        }

        .post-box textarea:focus { outline: none; border-color: #ff69b4; }

        .post-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .date-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ffe0f0;
            border-radius: 8px;
            font-size: 14px;
        }

        .file-input-label {
            padding: 10px 15px;
            background: #ffb6c1;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .file-input-label:hover { background: #ff69b4; }

        .post-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .image-preview {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .image-preview-item { position: relative; display: inline-block; }

        .image-preview-item img {
            max-width: 150px;
            max-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #ffe0f0;
        }

        .remove-image {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .upload-progress {
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            border: 2px solid #ffe0f0;
            display: none;
        }

        .upload-progress-bar {
            height: 20px;
            background: #ffe0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .upload-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            transition: width 0.3s;
        }

        .upload-progress-text { text-align: center; font-size: 13px; color: #666; }

        .posts-container { display: flex; flex-direction: column; gap: 20px; }

        .post-item {
            background: #fff9e6;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.15);
            border: 3px solid #ffe0f0;
            position: relative;
        }

        .post-item::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            width: 40px;
            height: 20px;
            background: #ffb6c1;
            border-radius: 5px 5px 0 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .post-author { font-weight: bold; color: #ff69b4; font-size: 16px; }
        .post-date { color: #999; font-size: 13px; }

        .post-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .post-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .post-images.single { grid-template-columns: 1fr; }
        .post-images.double { grid-template-columns: repeat(2, 1fr); }

        .post-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #ffe0f0;
            cursor: pointer;
        }

        .post-images.single .post-image { height: auto; max-height: 400px; }
        .post-images.double .post-image { height: 200px; }

        .post-actions-bar {
            display: flex;
            gap: 15px;
            padding-top: 10px;
            border-top: 2px dashed #ffe0f0;
        }

        .action-btn { background: none; border: none; color: #ff69b4; cursor: pointer; font-size: 14px; }

        .delete-post-btn {
            background: #ffb6c1;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .comments-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #ffe0f0;
        }

        .comment-item {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid #ffe0f0;
        }

        .comment-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .comment-author { color: #ff69b4; font-weight: bold; font-size: 14px; }
        .comment-date { color: #999; font-size: 12px; }

        .comment-content { color: #333; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .reply-info { color: #666; font-size: 13px; margin-bottom: 5px; }

        .comment-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .comment-images.single { grid-template-columns: 1fr; }
        .comment-images.double { grid-template-columns: repeat(2, 1fr); }

        .comment-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ffe0f0;
            cursor: pointer;
        }

        .comment-images.single .comment-image { height: auto; max-height: 200px; }

        .comment-actions { margin-top: 8px; display: flex; gap: 10px; }

        .reply-btn, .delete-comment-btn {
            background: none; border: none; color: #ff69b4; cursor: pointer; font-size: 13px;
        }

        .comment-input-area { display: none; margin-top: 10px; }

        .comment-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffe0f0;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .comment-input:focus { outline: none; border-color: #ff69b4; }

        .comment-image-preview { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }

        .comment-image-preview-item { position: relative; display: inline-block; }

        .comment-image-preview-item img {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ffe0f0;
        }

        .remove-comment-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .comment-actions-bar { margin-top: 8px; display: flex; gap: 8px; align-items: center; }

        .comment-image-label {
            padding: 6px 12px;
            background: #ffb6c1;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .comment-submit-btn {
            padding: 8px 15px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .cancel-comment-btn {
            padding: 8px 15px;
            background: #ccc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .image-viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .image-viewer img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .image-viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: #999; }

        .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.3; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .post-actions { flex-direction: column; }
            .date-input { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== 登录/注册页 ===== -->
    <div class="container login-container" id="authPage">
        <h1>💕 恋爱纪念册 💕</h1>
        <p>记录我们的每一个美好瞬间</p>

        <div class="tab-buttons">
            <button class="tab-btn active" id="loginTab" onclick="switchAuthTab('login')">登录</button>
            <button class="tab-btn" id="registerTab" onclick="switchAuthTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="input-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail" placeholder="请输入邮箱">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn" onclick="handleLogin()">登录</button>
            <p id="loginError" class="error-message"></p>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" style="display: none;">
            <div id="step1" style="display: block;">
                <div class="input-group">
                    <label>昵称</label>
                    <input type="text" id="registerNickname" placeholder="给自己起个昵称">
                </div>
                <div class="input-group">
                    <label>邮箱</label>
                    <input type="email" id="registerEmail" placeholder="请输入邮箱">
                </div>
                <button class="btn" onclick="sendVerificationCode()">发送验证码</button>
                <p id="step1Error" class="error-message"></p>
            </div>

            <div id="step2" style="display: none;">
                <div class="input-group">
                    <label>验证码</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="verificationCode" placeholder="请输入6位验证码" maxlength="6" style="flex: 1;">
                        <button class="resend-btn" onclick="resendCode()" id="resendBtn">重新发送</button>
                    </div>
                    <p class="hint-text">验证码已发送至 <span id="emailHint"></span></p>
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码（至少6位）">
                </div>
                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="请再次输入密码">
                </div>
                <button class="btn" onclick="handleRegister()">完成注册</button>
                <button class="btn-secondary" onclick="backToStep1()">返回修改邮箱</button>
                <p id="step2Error" class="error-message"></p>
            </div>
        </div>
    </div>

    <!-- ===== 情侣配对页 ===== -->
    <div class="container couple-setup-container" id="coupleSetupPage">
        <h1>💑 绑定你的另一半</h1>
        <p class="subtitle">配对后，你们的纪念册将完全私密，仅两人可见</p>

        <!-- 选择面板 -->
        <div class="couple-options" id="coupleOptions">
            <div class="couple-option-card" onclick="showPanel('createPanel')">
                <h3>💌 我来创建邀请码</h3>
                <p>生成一个专属邀请码，发送给你的 TA，等 TA 来加入你们的小世界</p>
            </div>
            <div class="couple-option-card" onclick="showPanel('joinPanel')">
                <h3>🔗 我有邀请码</h3>
                <p>输入 TA 发给你的邀请码，加入已创建的纪念册</p>
            </div>
        </div>

        <!-- 创建面板 -->
        <div class="couple-panel" id="createPanel">
            <div class="invite-code-display">
                <p>你的专属邀请码</p>
                <div class="code" id="myInviteCode">------</div>
                <p>将此码发给你的 TA，TA 输入后即可配对 💕</p>
                <button class="copy-code-btn" onclick="copyInviteCode()">📋 复制邀请码</button>
            </div>
            <div class="waiting-indicator">
                <span>等待 TA 加入</span>
                <div class="dot-pulse">
                    <span></span><span></span><span></span>
                </div>
            </div>
            <button class="btn-secondary" onclick="showPanel('coupleOptions')">返回</button>
        </div>

        <!-- 加入面板 -->
        <div class="couple-panel" id="joinPanel">
            <div class="input-group" style="margin-top: 10px;">
                <label>输入邀请码</label>
                <input type="text" id="joinCodeInput" placeholder="请输入6位邀请码" maxlength="6"
                    style="text-align:center; font-size:24px; letter-spacing:6px; font-family:monospace;"
                    oninput="this.value = this.value.toUpperCase()">
            </div>
            <button class="btn" onclick="joinCouple()">加入 TA 的纪念册 💕</button>
            <p id="joinError" class="error-message"></p>
            <button class="btn-secondary" onclick="showPanel('coupleOptions')">返回</button>
        </div>
    </div>

    <!-- ===== 主页 ===== -->
    <div class="container main-container" id="mainPage">
        <div class="header">
            <div>
                <h1>💕 恋爱纪念册</h1>
                <div class="user-info">
                    欢迎，<span id="currentUserDisplay"></span>
                    <span class="couple-badge" id="partnerBadge"></span>
                    <button class="logout-btn" onclick="logout()">退出</button>
                </div>
            </div>
        </div>

        <div class="post-box">
            <textarea id="postContent" placeholder="写下你想说的话..."></textarea>
            <div id="imagePreview" class="image-preview"></div>
            <div id="uploadProgress" class="upload-progress">
                <div class="upload-progress-bar">
                    <div id="uploadProgressFill" class="upload-progress-fill" style="width: 0%"></div>
                </div>
                <div id="uploadProgressText" class="upload-progress-text">正在上传...</div>
            </div>
            <div class="post-actions">
                <input type="datetime-local" id="postDate" class="date-input">
                <label for="imageInput" class="file-input-label">📷 添加照片</label>
                <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
                <button class="post-btn" onclick="createPost()">发布</button>
            </div>
        </div>

        <div class="posts-container" id="postsContainer">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <p>还没有记录哦，快来发布第一条动态吧！</p>
            </div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
        <button class="image-viewer-close" onclick="closeImageViewer()">×</button>
        <img id="viewerImage" src="" alt="查看图片">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script>
        // ============================================
        // 🔧 配置区
        // ============================================
        const APP_CONFIG = {
            supabase: {
                url: 'https://jencvwhpffrikvfewcuh.supabase.co',
                key: 'sb_publishable_G2ZuGMXTUk_VlnZT3tzneA_AUNdt5yp'
            },
            cloudinary: {
                cloudName: 'dklnmkp8u',
                uploadPreset: 'love_diary_preset'
            }
        };

        // ============================================
        // 全局状态
        // ============================================
        let supabaseClient = null;
        let cloudinaryCloudName = APP_CONFIG.cloudinary.cloudName;
        let cloudinaryUploadPreset = APP_CONFIG.cloudinary.uploadPreset;
        let currentUser = null;       // 当前用户昵称
        let currentUserId = null;     // 当前用户 Supabase UUID
        let currentCoupleId = null;   // 当前情侣组 ID（invite_code）
        let selectedFiles = [];
        let selectedImageUrls = [];
        let commentImages = {};
        let waitingPollTimer = null;  // 轮询等待配对的定时器

        // ============================================
        // 初始化
        // ============================================
        function initSupabase() {
            try {
                supabaseClient = supabase.createClient(
                    APP_CONFIG.supabase.url,
                    APP_CONFIG.supabase.key
                );
                return true;
            } catch (e) {
                console.error('Supabase 初始化失败:', e);
                return false;
            }
        }

        async function init() {
            initSupabase();
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session) {
                currentUserId = session.user.id;
                currentUser = session.user.user_metadata?.nickname || session.user.email.split('@')[0];
                await checkCoupleStatus();
            } else {
                showPage('authPage');
            }
        }

        init();

        // ============================================
        // 情侣状态检查
        // ============================================
        async function checkCoupleStatus() {
            // 先从 user_metadata 取缓存
            const { data: { user } } = await supabaseClient.auth.getUser();
            const cachedCoupleId = user.user_metadata?.couple_id;

            if (cachedCoupleId) {
                // 再验证数据库中该配对是否真实存在且已完成双向绑定
                const { data } = await supabaseClient
                    .from('couples')
                    .select('invite_code, user1_id, user2_id')
                    .eq('invite_code', cachedCoupleId)
                    .single();

                if (data && data.user1_id && data.user2_id) {
                    currentCoupleId = cachedCoupleId;
                    await showMainPage();
                    return;
                }
            }

            // 没有有效配对，进入配对页
            showPage('coupleSetupPage');
        }

        // ============================================
        // 页面切换工具
        // ============================================
        function showPage(pageId) {
            ['authPage', 'coupleSetupPage', 'mainPage'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            const target = document.getElementById(pageId);
            if (target) target.style.display = 'block';
        }

        // ============================================
        // 登录 / 注册
        // ============================================
        function switchAuthTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('loginTab').classList.toggle('active', tab === 'login');
            document.getElementById('registerTab').classList.toggle('active', tab === 'register');
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.classList.remove('show');

            if (!email || !password) {
                errorEl.textContent = '请输入邮箱和密码';
                errorEl.classList.add('show');
                return;
            }

            const loginBtn = document.querySelector('#loginForm .btn');
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    errorEl.textContent = '登录失败：' + error.message;
                    errorEl.classList.add('show');
                    return;
                }
                currentUserId = data.user.id;
                currentUser = data.user.user_metadata?.nickname || email.split('@')[0];
                await checkCoupleStatus();
            } catch (e) {
                errorEl.textContent = '登录失败：' + e.message;
                errorEl.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }

        async function sendVerificationCode() {
            const email = document.getElementById('registerEmail').value.trim();
            const nickname = document.getElementById('registerNickname').value.trim();
            const errorEl = document.getElementById('step1Error');
            const sendBtn = document.querySelector('#step1 .btn');
            errorEl.classList.remove('show');

            if (!nickname) { errorEl.textContent = '请输入昵称'; errorEl.classList.add('show'); return; }
            if (!email) { errorEl.textContent = '请输入邮箱'; errorEl.classList.add('show'); return; }

            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';

            try {
                const { error } = await supabaseClient.auth.signInWithOtp({
                    email,
                    options: { shouldCreateUser: true }
                });
                if (error) {
                    errorEl.textContent = '发送失败：' + error.message;
                    errorEl.classList.add('show');
                    return;
                }
                sessionStorage.setItem('verifyEmail', email);
                sessionStorage.setItem('verifyNickname', nickname);
                document.getElementById('emailHint').textContent = email;
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } catch (e) {
                errorEl.textContent = '发送失败：' + e.message;
                errorEl.classList.add('show');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送验证码';
            }
        }

        async function handleRegister() {
            const code = document.getElementById('verificationCode').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value.trim();
            const errorEl = document.getElementById('step2Error');
            errorEl.classList.remove('show');

            const email = sessionStorage.getItem('verifyEmail');
            const nickname = sessionStorage.getItem('verifyNickname');

            if (!code) { errorEl.textContent = '请输入验证码'; errorEl.classList.add('show'); return; }
            if (password.length < 6) { errorEl.textContent = '密码至少需要6位'; errorEl.classList.add('show'); return; }
            if (password !== passwordConfirm) { errorEl.textContent = '两次输入的密码不一致'; errorEl.classList.add('show'); return; }

            const regBtn = document.querySelector('#step2 .btn');
            regBtn.disabled = true;
            regBtn.textContent = '注册中...';

            try {
                const { data: verifyData, error: verifyError } = await supabaseClient.auth.verifyOtp({
                    email, token: code, type: 'email'
                });
                if (verifyError) {
                    errorEl.textContent = '验证码错误或已过期';
                    errorEl.classList.add('show');
                    return;
                }

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    password,
                    data: { nickname }
                });
                if (updateError) {
                    errorEl.textContent = '设置密码失败：' + updateError.message;
                    errorEl.classList.add('show');
                    return;
                }

                sessionStorage.removeItem('verifyEmail');
                sessionStorage.removeItem('verifyNickname');
                currentUserId = verifyData.user.id;
                currentUser = nickname;
                alert('注册成功！欢迎使用💕\n\n接下来请绑定你的另一半~');
                await checkCoupleStatus();
            } catch (e) {
                errorEl.textContent = '注册失败：' + e.message;
                errorEl.classList.add('show');
            } finally {
                regBtn.disabled = false;
                regBtn.textContent = '完成注册';
            }
        }

        function backToStep1() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
        }

        function resendCode() { sendVerificationCode(); }

        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            stopWaitingPoll();
            await supabaseClient.auth.signOut();
            currentUser = null;
            currentUserId = null;
            currentCoupleId = null;
            location.reload();
        }

        // ============================================
        // 情侣配对系统
        // ============================================

        // 显示配对子面板
        function showPanel(panelId) {
            stopWaitingPoll();
            document.getElementById('coupleOptions').style.display = 'none';
            document.getElementById('createPanel').classList.remove('active');
            document.getElementById('joinPanel').classList.remove('active');

            if (panelId === 'coupleOptions') {
                document.getElementById('coupleOptions').style.display = 'flex';
            } else {
                document.getElementById(panelId).classList.add('active');
                if (panelId === 'createPanel') initCreateCouple();
            }
        }

        // 生成随机6位大写邀请码
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        // 创建配对
        async function initCreateCouple() {
            const code = generateCode();
            document.getElementById('myInviteCode').textContent = code;

            // 先删除该用户之前未完成的记录
            await supabaseClient
                .from('couples')
                .delete()
                .eq('user1_id', currentUserId)
                .is('user2_id', null);

            // 插入新记录
            const { error } = await supabaseClient
                .from('couples')
                .insert([{ invite_code: code, user1_id: currentUserId }]);

            if (error) {
                alert('创建邀请码失败：' + error.message);
                return;
            }

            // 开始轮询等待对方加入
            startWaitingPoll(code);
        }

        // 轮询等待对方扫码加入
        function startWaitingPoll(inviteCode) {
            stopWaitingPoll();
            waitingPollTimer = setInterval(async () => {
                const { data } = await supabaseClient
                    .from('couples')
                    .select('user2_id')
                    .eq('invite_code', inviteCode)
                    .single();

                if (data && data.user2_id) {
                    stopWaitingPoll();
                    // 对方已加入，保存 couple_id 到自己的 metadata
                    await supabaseClient.auth.updateUser({
                        data: { couple_id: inviteCode }
                    });
                    currentCoupleId = inviteCode;
                    alert('配对成功！你们的专属纪念册已建立 💕');
                    await showMainPage();
                }
            }, 3000);
        }

        function stopWaitingPoll() {
            if (waitingPollTimer) {
                clearInterval(waitingPollTimer);
                waitingPollTimer = null;
            }
        }

        // 加入配对
        async function joinCouple() {
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            const errorEl = document.getElementById('joinError');
            errorEl.classList.remove('show');

            if (code.length !== 6) {
                errorEl.textContent = '请输入6位邀请码';
                errorEl.classList.add('show');
                return;
            }

            const joinBtn = document.querySelector('#joinPanel .btn');
            joinBtn.disabled = true;
            joinBtn.textContent = '配对中...';

            try {
                // 查找邀请码
                const { data, error } = await supabaseClient
                    .from('couples')
                    .select('*')
                    .eq('invite_code', code)
                    .single();

                if (error || !data) {
                    errorEl.textContent = '邀请码不存在，请确认后重试';
                    errorEl.classList.add('show');
                    return;
                }

                if (data.user2_id) {
                    errorEl.textContent = '该邀请码已被使用';
                    errorEl.classList.add('show');
                    return;
                }

                if (data.user1_id === currentUserId) {
                    errorEl.textContent = '不能使用自己的邀请码';
                    errorEl.classList.add('show');
                    return;
                }

                // 更新 couples 表，填入 user2_id
                const { error: updateErr } = await supabaseClient
                    .from('couples')
                    .update({ user2_id: currentUserId })
                    .eq('invite_code', code);

                if (updateErr) throw updateErr;

                // 保存 couple_id 到自己的 metadata
                await supabaseClient.auth.updateUser({
                    data: { couple_id: code }
                });

                currentCoupleId = code;
                alert('配对成功！你们的专属纪念册已建立 💕');
                await showMainPage();
            } catch (e) {
                errorEl.textContent = '配对失败：' + e.message;
                errorEl.classList.add('show');
            } finally {
                joinBtn.disabled = false;
                joinBtn.textContent = '加入 TA 的纪念册 💕';
            }
        }

        function copyInviteCode() {
            const code = document.getElementById('myInviteCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('邀请码已复制：' + code);
            }).catch(() => {
                alert('邀请码：' + code + '\n\n请手动复制');
            });
        }

        // ============================================
        // 主页
        // ============================================
        async function showMainPage() {
            stopWaitingPoll();
            showPage('mainPage');
            document.getElementById('currentUserDisplay').textContent = currentUser;

            // 显示情侣信息
            await loadPartnerInfo();

            const now = new Date();
            const offsetDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
            document.getElementById('postDate').value = offsetDate.toISOString().slice(0, 16);

            setupImageInput();
            loadPosts();
        }

        // 加载并显示伴侣昵称
        async function loadPartnerInfo() {
            if (!currentCoupleId) return;
            try {
                const { data } = await supabaseClient
                    .from('couples')
                    .select('user1_id, user2_id')
                    .eq('invite_code', currentCoupleId)
                    .single();

                if (!data) return;
                const partnerId = data.user1_id === currentUserId ? data.user2_id : data.user1_id;
                if (!partnerId) return;

                // 从 profiles 表读取伴侣昵称（如果有）
                // 这里用 posts 表中最近一条该用户的记录来获取昵称
                const { data: postData } = await supabaseClient
                    .from('posts')
                    .select('author')
                    .eq('user_id', partnerId)
                    .limit(1)
                    .single();

                if (postData) {
                    document.getElementById('partnerBadge').textContent = '❤️ ' + postData.author;
                } else {
                    document.getElementById('partnerBadge').textContent = '❤️ 等待 TA 发帖';
                }
            } catch (e) {
                // 静默失败，不影响主功能
            }
        }

        // ============================================
        // 图片处理
        // ============================================
        function setupImageInput() {
            const input = document.getElementById('imageInput');
            // 避免重复绑定
            input.onchange = function(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                selectedFiles = [...selectedFiles, ...files];
                renderImagePreview();
            };
        }

        function renderImagePreview() {
            const container = document.getElementById('imagePreview');
            container.innerHTML = '';

            selectedImageUrls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                const img = document.createElement('img');
                img.src = url;
                const btn = document.createElement('button');
                btn.className = 'remove-image';
                btn.textContent = '×';
                btn.onclick = () => { selectedImageUrls.splice(index, 1); renderImagePreview(); };
                div.appendChild(img); div.appendChild(btn);
                container.appendChild(div);
            });

            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                const btn = document.createElement('button');
                btn.className = 'remove-image';
                btn.textContent = '×';
                btn.onclick = () => {
                    selectedFiles.splice(index, 1);
                    if (selectedFiles.length === 0) document.getElementById('imageInput').value = '';
                    renderImagePreview();
                };
                div.appendChild(img); div.appendChild(btn);
                container.appendChild(div);
            });
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', cloudinaryUploadPreset);
            formData.append('folder', 'love-diary/' + currentCoupleId);

            const response = await fetch(
                'https://api.cloudinary.com/v1_1/' + cloudinaryCloudName + '/image/upload',
                { method: 'POST', body: formData }
            );
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || '上传失败');
            }
            const data = await response.json();
            return data.secure_url;
        }

        function showUploadProgress(current, total) {
            document.getElementById('uploadProgress').style.display = 'block';
            document.getElementById('uploadProgressFill').style.width = Math.round(current / total * 100) + '%';
            document.getElementById('uploadProgressText').textContent = '正在上传 ' + current + '/' + total + ' 张图片...';
        }

        function hideUploadProgress() {
            document.getElementById('uploadProgress').style.display = 'none';
        }

        // ============================================
        // 帖子操作
        // ============================================
        async function createPost() {
            const content = document.getElementById('postContent').value.trim();
            const postDate = document.getElementById('postDate').value;

            if (!content && selectedFiles.length === 0 && selectedImageUrls.length === 0) {
                alert('请输入内容或选择图片');
                return;
            }
            if (!currentCoupleId) {
                alert('请先完成情侣配对');
                return;
            }

            const postBtn = document.querySelector('.post-btn');
            postBtn.disabled = true;

            try {
                const uploadedUrls = [];
                for (let i = 0; i < selectedFiles.length; i++) {
                    showUploadProgress(i + 1, selectedFiles.length);
                    uploadedUrls.push(await uploadToCloudinary(selectedFiles[i]));
                }
                hideUploadProgress();

                const allImages = [...selectedImageUrls, ...uploadedUrls];
                const eventDate = postDate ? new Date(postDate).toISOString() : new Date().toISOString();

                const result = await supabaseClient
                    .from('posts')
                    .insert([{
                        post_id: Date.now(),
                        user_id: currentUserId,
                        couple_id: currentCoupleId,
                        author: currentUser,
                        content: content || null,
                        images: allImages.length > 0 ? allImages : null,
                        date: eventDate
                    }])
                    .select();

                if (result.error) throw result.error;

                document.getElementById('postContent').value = '';
                selectedFiles = []; selectedImageUrls = [];
                renderImagePreview();
                document.getElementById('imageInput').value = '';

                const now = new Date();
                document.getElementById('postDate').value =
                    new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

                await loadPosts();
                alert('发布成功！');
            } catch (e) {
                hideUploadProgress();
                alert('发布失败：' + e.message);
            } finally {
                postBtn.disabled = false;
            }
        }

        async function loadPosts() {
            if (!currentCoupleId) return;

            const container = document.getElementById('postsContainer');

            try {
                // 仅读取本情侣组的帖子
                const postsResult = await supabaseClient
                    .from('posts')
                    .select('*')
                    .eq('couple_id', currentCoupleId)
                    .order('date', { ascending: false });

                if (postsResult.error) throw postsResult.error;

                // 仅读取本情侣组的评论
                const commentsResult = await supabaseClient
                    .from('comments')
                    .select('*')
                    .eq('couple_id', currentCoupleId)
                    .order('date', { ascending: true });

                if (commentsResult.error) throw commentsResult.error;

                const posts = postsResult.data || [];
                const comments = commentsResult.data || [];

                renderPosts(posts.map(post => ({
                    ...post,
                    comments: comments.filter(c => c.post_id === post.post_id)
                })));
            } catch (e) {
                container.innerHTML = '<div class="empty-state"><p style="color:#ff1493;">加载失败：' + escapeHtml(e.message) + '</p></div>';
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            if (!posts || posts.length === 0) {
                const div = document.createElement('div');
                div.className = 'empty-state';
                div.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><p>还没有记录哦，快来发布第一条动态吧！</p>';
                container.appendChild(div);
                return;
            }
            posts.forEach(post => container.appendChild(createPostElement(post)));
        }

        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'post-item';

            const header = document.createElement('div');
            header.className = 'post-header';

            const author = document.createElement('span');
            author.className = 'post-author';
            author.textContent = post.author;

            const rightDiv = document.createElement('div');
            rightDiv.style.display = 'flex';
            rightDiv.style.alignItems = 'center';
            rightDiv.style.gap = '8px';

            const date = document.createElement('span');
            date.className = 'post-date';
            date.textContent = formatDate(new Date(post.date).getTime());
            rightDiv.appendChild(date);

            // 只允许本人删除（用 user_id 比较，比 author 字符串更安全）
            if (post.user_id === currentUserId) {
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-post-btn';
                delBtn.textContent = '删除';
                delBtn.onclick = () => deletePost(post.post_id);
                rightDiv.appendChild(delBtn);
            }

            header.appendChild(author);
            header.appendChild(rightDiv);
            div.appendChild(header);

            if (post.content) {
                const content = document.createElement('div');
                content.className = 'post-content';
                content.textContent = post.content;
                div.appendChild(content);
            }

            if (post.images && post.images.length > 0) {
                const imagesDiv = document.createElement('div');
                imagesDiv.className = 'post-images' +
                    (post.images.length === 1 ? ' single' : post.images.length === 2 ? ' double' : '');
                post.images.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url; img.className = 'post-image';
                    img.onclick = () => viewImage(url);
                    imagesDiv.appendChild(img);
                });
                div.appendChild(imagesDiv);
            }

            const actionsBar = document.createElement('div');
            actionsBar.className = 'post-actions-bar';
            const commentBtn = document.createElement('button');
            commentBtn.className = 'action-btn';
            commentBtn.textContent = '💬 评论 (' + post.comments.length + ')';
            commentBtn.onclick = () => toggleCommentInput(post.post_id);
            actionsBar.appendChild(commentBtn);
            div.appendChild(actionsBar);
            div.appendChild(createCommentInputArea(post.post_id));

            if (post.comments && post.comments.length > 0) {
                const sec = document.createElement('div');
                sec.className = 'comments-section';
                post.comments.forEach(c => sec.appendChild(createCommentElement(c, post.post_id)));
                div.appendChild(sec);
            }

            return div;
        }

        // ============================================
        // 评论
        // ============================================
        function createCommentInputArea(postId) {
            const div = document.createElement('div');
            div.id = 'commentInput-' + postId;
            div.className = 'comment-input-area';

            const textarea = document.createElement('textarea');
            textarea.className = 'comment-input';
            textarea.id = 'commentText-' + postId;
            textarea.placeholder = '写下你的评论...';
            div.appendChild(textarea);

            const previewDiv = document.createElement('div');
            previewDiv.id = 'commentImagePreview-' + postId;
            previewDiv.className = 'comment-image-preview';
            div.appendChild(previewDiv);

            const bar = document.createElement('div');
            bar.className = 'comment-actions-bar';

            const label = document.createElement('label');
            label.htmlFor = 'commentImageInput-' + postId;
            label.className = 'comment-image-label';
            label.textContent = '📷';

            const input = document.createElement('input');
            input.type = 'file'; input.id = 'commentImageInput-' + postId;
            input.accept = 'image/*'; input.multiple = true; input.style.display = 'none';
            input.onchange = e => previewCommentImage(e, postId);

            const sendBtn = document.createElement('button');
            sendBtn.className = 'comment-submit-btn';
            sendBtn.textContent = '发送';
            sendBtn.onclick = () => addComment(postId);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'cancel-comment-btn';
            cancelBtn.textContent = '取消';
            cancelBtn.onclick = () => toggleCommentInput(postId);

            bar.appendChild(label); bar.appendChild(input);
            bar.appendChild(sendBtn); bar.appendChild(cancelBtn);
            div.appendChild(bar);
            return div;
        }

        function createCommentElement(comment, postId) {
            const div = document.createElement('div');
            div.className = 'comment-item';

            const header = document.createElement('div');
            header.className = 'comment-header';

            const author = document.createElement('span');
            author.className = 'comment-author';
            author.textContent = comment.author;

            const date = document.createElement('span');
            date.className = 'comment-date';
            date.textContent = formatDate(new Date(comment.date).getTime());

            header.appendChild(author); header.appendChild(date);
            div.appendChild(header);

            if (comment.reply_to) {
                const ri = document.createElement('div');
                ri.className = 'reply-info';
                ri.textContent = '回复 @' + comment.reply_to;
                div.appendChild(ri);
            }

            if (comment.content) {
                const c = document.createElement('div');
                c.className = 'comment-content';
                c.textContent = comment.content;
                div.appendChild(c);
            }

            if (comment.images && comment.images.length > 0) {
                const imgs = document.createElement('div');
                imgs.className = 'comment-images' +
                    (comment.images.length === 1 ? ' single' : comment.images.length === 2 ? ' double' : '');
                comment.images.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url; img.className = 'comment-image';
                    img.onclick = () => viewImage(url);
                    imgs.appendChild(img);
                });
                div.appendChild(imgs);
            }

            const actions = document.createElement('div');
            actions.className = 'comment-actions';

            const replyBtn = document.createElement('button');
            replyBtn.className = 'reply-btn';
            replyBtn.textContent = '回复';
            replyBtn.onclick = () => toggleReplyInput(postId, comment.id, comment.author);
            actions.appendChild(replyBtn);

            // 只允许本人删除（用 user_id）
            if (comment.user_id === currentUserId) {
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-comment-btn';
                delBtn.textContent = '删除';
                delBtn.onclick = () => deleteComment(comment.id);
                actions.appendChild(delBtn);
            }

            div.appendChild(actions);
            div.appendChild(createReplyInputArea(postId, comment.id, comment.author));
            return div;
        }

        function createReplyInputArea(postId, commentId, authorName) {
            const div = document.createElement('div');
            div.id = 'replyInput-' + postId + '-' + commentId;
            div.className = 'comment-input-area';

            const textarea = document.createElement('textarea');
            textarea.className = 'comment-input';
            textarea.id = 'replyText-' + postId + '-' + commentId;
            textarea.placeholder = '回复 ' + authorName + '...';
            div.appendChild(textarea);

            const previewDiv = document.createElement('div');
            previewDiv.id = 'replyImagePreview-' + postId + '-' + commentId;
            previewDiv.className = 'comment-image-preview';
            div.appendChild(previewDiv);

            const bar = document.createElement('div');
            bar.className = 'comment-actions-bar';

            const label = document.createElement('label');
            label.htmlFor = 'replyImageInput-' + postId + '-' + commentId;
            label.className = 'comment-image-label';
            label.textContent = '📷';

            const input = document.createElement('input');
            input.type = 'file'; input.id = 'replyImageInput-' + postId + '-' + commentId;
            input.accept = 'image/*'; input.multiple = true; input.style.display = 'none';
            input.onchange = e => previewReplyImage(e, postId, commentId);

            const sendBtn = document.createElement('button');
            sendBtn.className = 'comment-submit-btn';
            sendBtn.textContent = '发送';
            sendBtn.onclick = () => addReply(postId, authorName, commentId);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'cancel-comment-btn';
            cancelBtn.textContent = '取消';
            cancelBtn.onclick = () => toggleReplyInput(postId, commentId);

            bar.appendChild(label); bar.appendChild(input);
            bar.appendChild(sendBtn); bar.appendChild(cancelBtn);
            div.appendChild(bar);
            return div;
        }

        function toggleCommentInput(postId) {
            const el = document.getElementById('commentInput-' + postId);
            if (el.style.display === 'block') {
                el.style.display = 'none';
                delete commentImages['comment-' + postId];
                document.getElementById('commentImagePreview-' + postId).innerHTML = '';
            } else {
                el.style.display = 'block';
                document.getElementById('commentText-' + postId).focus();
            }
        }

        function toggleReplyInput(postId, commentId) {
            const el = document.getElementById('replyInput-' + postId + '-' + commentId);
            if (el.style.display === 'block') {
                el.style.display = 'none';
                delete commentImages['reply-' + postId + '-' + commentId];
                document.getElementById('replyImagePreview-' + postId + '-' + commentId).innerHTML = '';
            } else {
                el.style.display = 'block';
                document.getElementById('replyText-' + postId + '-' + commentId).focus();
            }
        }

        // 评论图片预览
        function previewCommentImage(event, postId) {
            const files = Array.from(event.target.files);
            if (!commentImages['comment-' + postId]) commentImages['comment-' + postId] = { files: [], urls: [] };
            commentImages['comment-' + postId].files.push(...files);
            renderCommentImagePreview(postId);
        }

        function renderCommentImagePreview(postId) {
            const container = document.getElementById('commentImagePreview-' + postId);
            const data = commentImages['comment-' + postId];
            container.innerHTML = '';
            if (!data) return;
            data.urls.forEach((url, i) => {
                container.appendChild(buildPreviewItem(url, () => { data.urls.splice(i, 1); renderCommentImagePreview(postId); }));
            });
            data.files.forEach((file, i) => {
                container.appendChild(buildPreviewItem(URL.createObjectURL(file), () => { data.files.splice(i, 1); renderCommentImagePreview(postId); }));
            });
        }

        function previewReplyImage(event, postId, commentId) {
            const key = 'reply-' + postId + '-' + commentId;
            const files = Array.from(event.target.files);
            if (!commentImages[key]) commentImages[key] = { files: [], urls: [] };
            commentImages[key].files.push(...files);
            renderReplyImagePreview(postId, commentId);
        }

        function renderReplyImagePreview(postId, commentId) {
            const key = 'reply-' + postId + '-' + commentId;
            const container = document.getElementById('replyImagePreview-' + postId + '-' + commentId);
            const data = commentImages[key];
            container.innerHTML = '';
            if (!data) return;
            data.urls.forEach((url, i) => {
                container.appendChild(buildPreviewItem(url, () => { data.urls.splice(i, 1); renderReplyImagePreview(postId, commentId); }));
            });
            data.files.forEach((file, i) => {
                container.appendChild(buildPreviewItem(URL.createObjectURL(file), () => { data.files.splice(i, 1); renderReplyImagePreview(postId, commentId); }));
            });
        }

        function buildPreviewItem(src, onRemove) {
            const div = document.createElement('div');
            div.className = 'comment-image-preview-item';
            const img = document.createElement('img');
            img.src = src;
            const btn = document.createElement('button');
            btn.className = 'remove-comment-image';
            btn.textContent = '×';
            btn.onclick = onRemove;
            div.appendChild(img); div.appendChild(btn);
            return div;
        }

        async function addComment(postId) {
            const content = document.getElementById('commentText-' + postId).value.trim();
            const data = commentImages['comment-' + postId];
            if (!content && (!data || (data.files.length === 0 && data.urls.length === 0))) {
                alert('请输入评论内容或选择图片');
                return;
            }

            try {
                const uploadedUrls = [];
                if (data && data.files.length > 0) {
                    for (const file of data.files) uploadedUrls.push(await uploadToCloudinary(file));
                }
                const allImages = data ? [...(data.urls || []), ...uploadedUrls] : [];

                const result = await supabaseClient.from('comments').insert([{
                    post_id: postId,
                    user_id: currentUserId,
                    couple_id: currentCoupleId,
                    author: currentUser,
                    content: content || null,
                    images: allImages.length > 0 ? allImages : null,
                    reply_to: null
                }]);

                if (result.error) throw result.error;
                delete commentImages['comment-' + postId];
                await loadPosts();
            } catch (e) {
                alert('评论失败：' + e.message);
            }
        }

        async function addReply(postId, replyToAuthor, commentId) {
            const content = document.getElementById('replyText-' + postId + '-' + commentId).value.trim();
            const key = 'reply-' + postId + '-' + commentId;
            const data = commentImages[key];
            if (!content && (!data || (data.files.length === 0 && data.urls.length === 0))) {
                alert('请输入回复内容或选择图片');
                return;
            }

            try {
                const uploadedUrls = [];
                if (data && data.files.length > 0) {
                    for (const file of data.files) uploadedUrls.push(await uploadToCloudinary(file));
                }
                const allImages = data ? [...(data.urls || []), ...uploadedUrls] : [];

                const result = await supabaseClient.from('comments').insert([{
                    post_id: postId,
                    user_id: currentUserId,
                    couple_id: currentCoupleId,
                    author: currentUser,
                    content: content || null,
                    images: allImages.length > 0 ? allImages : null,
                    reply_to: replyToAuthor
                }]);

                if (result.error) throw result.error;
                delete commentImages[key];
                await loadPosts();
            } catch (e) {
                alert('回复失败：' + e.message);
            }
        }

        async function deletePost(postId) {
            if (!confirm('确定要删除这条动态吗？')) return;
            try {
                await supabaseClient.from('comments').delete().eq('post_id', postId);
                const r = await supabaseClient.from('posts').delete().eq('post_id', postId);
                if (r.error) throw r.error;
                await loadPosts();
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        async function deleteComment(commentId) {
            if (!confirm('确定要删除这条评论吗？')) return;
            try {
                const r = await supabaseClient.from('comments').delete().eq('id', commentId);
                if (r.error) throw r.error;
                await loadPosts();
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        // ============================================
        // 工具函数
        // ============================================
        function viewImage(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('imageViewer').style.display = 'flex';
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').style.display = 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000 && date.getDate() === now.getDate())
                return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            if (diff < 172800000 && date.getDate() === now.getDate() - 1)
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            }).replace(/\//g, '-');
        }
    </script>
</body>
